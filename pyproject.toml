[project]
name = "evidence-check"
version = "0.1.0"
description = "Test claim verification against a labeled source collection."
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.50,<2",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "typesafe-sdk>=0.7.5,<0.8",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
