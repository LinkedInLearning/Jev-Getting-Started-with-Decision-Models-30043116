[project]
name = "jev-course-ats-starter"
version = "0.1.0"
description = "An LLM-powered resume evidence matching workbench for the Jev course."
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.50,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "pypdf>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
